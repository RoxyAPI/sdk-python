[build-system]
requires = ["uv_build>=0.11.6,<0.13"]
build-backend = "uv_build"

[project]
name = "roxy-sdk"
version = "0.1.86"
description = "Python SDK for RoxyAPI. Astrology, tarot, numerology, and more."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
]
keywords = [
    "astrology",
    "vedic",
    "tarot",
    "numerology",
    "horoscope",
    "kundli",
    "birth-chart",
    "natal-chart",
    "iching",
    "crystals",
    "angel-numbers",
    "dreams",
    "biorhythm",
    "spiritual",
    "api",
    "sdk",
    "async",
    "fastapi",
    "ai-agent",
    "mcp",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://roxyapi.com"
Repository = "https://github.com/RoxyAPI/sdk-python"
Documentation = "https://roxyapi.com/docs"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.9",
    "ruff>=0.4",
    "lefthook>=2.1.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Generated output is never linted or formatted, also when a hook passes it explicitly.
exclude = ["src/roxy_sdk/factory.py"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The long lines are the factory.py lines the generator emits verbatim.
"codegen.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/roxy_sdk", "codegen.py", "sync_docs.py", "generate.py", "tests/test_factory.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
